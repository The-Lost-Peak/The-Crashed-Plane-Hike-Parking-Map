<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Parking Locations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: #000;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    #map { position: absolute; inset: 0; }

    .mapboxgl-popup-content {
      padding: 15px 15px 10px 15px;
      border-radius: 20px;
    }

    .mapboxgl-popup-tip { display: none; }

    .mapboxgl-popup-content a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #3899EC;
      text-decoration: none;
      outline: none !important;
      box-shadow: none !important;
      border: none !important;
    }

    .directions-icon {
      width: 14px;
      height: 14px;
      background-color: #3899EC;
      mask: url("icons/marker-svgrepo-com.svg") no-repeat center;
      -webkit-mask: url("icons/marker-svgrepo-com.svg") no-repeat center;
      mask-size: contain;
      -webkit-mask-size: contain;
      display: inline-block;
    }
  </style>
<style>
/* buttons: one frosted white capsule, same as the 3D route map above it on the hike page */
.grp{position:absolute;right:10px;bottom:40px;z-index:10;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;
  background:rgba(255,255,255,.86);box-shadow:0 4px 16px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%)}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.grp{background:rgba(255,255,255,.95)}}
.fs-btn{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fs-btn+.fs-btn{border-top:1px solid rgba(0,0,0,.09)}
.fs-btn:focus{outline:0}.fs-btn:active{background:rgba(0,0,0,.06)}
@media(hover:hover){.fs-btn:hover{background:rgba(0,0,0,.05)}}
.fs-btn svg{fill:none;stroke:#1c1c1e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px;display:block}
body.fs .grp{right:18px;bottom:44px}body.fs .fs-btn{width:48px;height:48px}body.fs .fs-btn svg{width:23px;height:23px}
</style>
</head>
<body>
  <div id="map"></div>
  <div class="grp">
    <button id="b-in" class="fs-btn" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="b-out" class="fs-btn" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="b-reset" class="fs-btn" title="Show all the parking" aria-label="Show all the parking"><svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg></button>
    <button id="b-fs" class="fs-btn" title="Fullscreen" aria-label="Fullscreen"><svg id="i-exp" viewBox="0 0 24 24"><polyline points="4,9 4,4 9,4"/><polyline points="20,9 20,4 15,4"/><polyline points="4,15 4,20 9,20"/><polyline points="20,15 20,20 15,20"/></svg><svg id="i-col" viewBox="0 0 24 24" style="display:none"><polyline points="4,9 9,9 9,4"/><polyline points="20,9 15,9 15,4"/><polyline points="4,15 9,15 9,20"/><polyline points="20,15 15,15 15,20"/></svg></button>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <script>
    mapboxgl.accessToken = "pk.eyJ1IjoicmVtbWlhZ2JlYmkiLCJhIjoiY21odHRrYTQzMTk0bjJqcjE1b2xhZ2FraSJ9.nTCz33gX0gQt3T4A6VD0oQ";

    const carParks = [
      { name: "Main Parking",  coords: [-1.8689178281704162, 53.43294571969499] },
      { name: "Alternative 1", coords: [-1.856806, 53.432667] },
      { name: "Alternative 2", coords: [-1.850374700508498, 53.432955195575865] },
      { name: "Alternative 3", coords: [-1.846444, 53.431722] }
    ];

    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/satellite-streets-v12",
      center: carParks[0].coords,
      zoom: 15,
      attributionControl: false
    });
    map.addControl(new mapboxgl.AttributionControl({ compact: true }), "bottom-right");

    /* buttons */
    document.getElementById("b-in").onclick = () => map.zoomIn();
    document.getElementById("b-out").onclick = () => map.zoomOut();
    function showAll(d) {
      const b = new mapboxgl.LngLatBounds();
      carParks.forEach(p => b.extend(p.coords));
      map.fitBounds(b, { padding: { top: 70, bottom: 50, left: 40, right: 70 }, maxZoom: 15.5, duration: d });
    }
    document.getElementById("b-reset").onclick = () => { if (openPopup) openPopup.remove(); showAll(900); };
    /* full screen: on a Lost Peak page the page grows this map to fill the screen (works on iPhone too) */
    const EMBEDDED = window.self !== window.top;
    let fsOn = false;
    function setFs(on) {
      fsOn = on;
      document.body.classList.toggle("fs", on);
      document.getElementById("i-exp").style.display = on ? "none" : "block";
      document.getElementById("i-col").style.display = on ? "block" : "none";
      setTimeout(() => map.resize(), 60); setTimeout(() => map.resize(), 400);
    }
    document.getElementById("b-fs").onclick = () => {
      if (EMBEDDED) { setFs(!fsOn); try { window.parent.postMessage({ type: "lpFs", on: fsOn }, "*"); } catch (e) {} return; }
      if (!document.fullscreenElement) { (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || function(){}).call(document.documentElement); }
      else if (document.exitFullscreen) document.exitFullscreen();
    };
    document.addEventListener("fullscreenchange", () => setFs(!!document.fullscreenElement));
    document.addEventListener("keydown", e => { if (e.key === "Escape" && fsOn && EMBEDDED) { setFs(false); try { window.parent.postMessage({ type: "lpFs", on: false }, "*"); } catch (x) {} } });

    function popupHtml(name, coords) {
      return `
        <div style="font-size:13px;line-height:1.3">
          <div style="margin-bottom:6px;font-weight:600">${name}</div>
          <a target="_blank" rel="noopener"
             href="https://www.google.com/maps/dir/?api=1&destination=${coords[1]},${coords[0]}">
            <span class="directions-icon"></span>
            Directions
          </a>
        </div>
      `;
    }

    let openPopup = null;

    carParks.forEach((p) => {
      const popup = new mapboxgl.Popup({
        offset: 16,
        closeButton: false,
        closeOnClick: false
      }).setHTML(popupHtml(p.name, p.coords));

      const marker = new mapboxgl.Marker({
        color: "#EC2629",
        scale: 0.85
      })
        .setLngLat(p.coords)
        .addTo(map);

      marker.getElement().addEventListener("click", () => {
        if (openPopup) openPopup.remove();
        popup.setLngLat(p.coords).addTo(map);
        openPopup = popup;
        map.flyTo({ center: p.coords, zoom: 15, essential: true });
      });
    });

    map.on("load", () => {
      const first = carParks[0];
      const firstPopup = new mapboxgl.Popup({
        offset: 16,
        closeButton: false,
        closeOnClick: false
      }).setHTML(popupHtml(first.name, first.coords))
        .setLngLat(first.coords)
        .addTo(map);

      openPopup = firstPopup;
      map.jumpTo({ center: first.coords, zoom: 15 });
    });
  </script>
</body>
</html>
